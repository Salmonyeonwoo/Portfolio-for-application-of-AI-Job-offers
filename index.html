                                                                {curT.evalFeedbackLabel}:
                                                            </strong>
                                                            <span className={`text-[10px] font-mono font-bold px-2 py-0.5 rounded border ${simResult.score >= 90 ? 'bg-emerald-950/80 text-emerald-300 border-emerald-500/40' :
                                                                simResult.score >= 75 ? 'bg-indigo-950/80 text-indigo-300 border-indigo-500/40' :
                                                                    simResult.score >= 50 ? 'bg-amber-950/80 text-amber-300 border-amber-500/40' :
                                                                        'bg-rose-950/80 text-rose-300 border-rose-500/40'
                                                                }`}>
                                                                {simResult.diagnosisBadge}
                                                            </span>
                                                        </div>

                                                        {/* Executive Diagnostic Summary */}
                                                        <p className="text-slate-200 font-medium leading-relaxed">
                                                            {simResult.summary}
                                                        </p>

                                                        {/* Verified Operational Strengths */}
                                                        {simResult.strengths && simResult.strengths.length > 0 && (
                                                            <div className="space-y-1.5 pt-2 border-t border-slate-800/60">
                                                                <span className="text-[10px] font-black text-emerald-400 uppercase tracking-wider block">
                                                                    {curT.evalStrengthsLabel || '✓ Verified Strengths'} ({simResult.strengths.length})
                                                                </span>
                                                                <div className="space-y-1">
                                                                    {simResult.strengths.map((st, i) => (
                                                                        <div key={i} className="flex items-start gap-1.5 text-[11px] text-slate-300">
                                                                            <i className="fa-solid fa-check text-emerald-400 text-[10px] mt-0.5 shrink-0"></i>
                                                                            <span>{st}</span>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        )}

                                                        {/* Identified Operational Gaps */}
                                                        {simResult.gaps && simResult.gaps.length > 0 && (
                                                            <div className="space-y-1.5 pt-2 border-t border-slate-800/60">
                                                                <span className="text-[10px] font-black text-amber-400 uppercase tracking-wider block">
                                                                    {curT.evalGapsLabel || '▲ Remediation Gaps'} ({simResult.gaps.length})
                                                                </span>
                                                                <div className="space-y-1">
                                                                    {simResult.gaps.map((gp, i) => (
                                                                        <div key={i} className="flex items-start gap-1.5 text-[11px] text-slate-300">
                                                                            <i className="fa-solid fa-triangle-exclamation text-amber-400 text-[10px] mt-0.5 shrink-0"></i>
                                                                            <span>{gp}</span>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        )}

                                                        {/* Actionable Senior Coaching Directive Box */}
                                                        <div className="bg-indigo-950/40 border border-indigo-500/30 p-3 rounded-xl space-y-1 mt-2">
                                                            <span className="text-[10px] font-black text-cyan-300 uppercase block flex items-center gap-1.5">
                                                                <i className="fa-solid fa-compass"></i>
                                                                {curT.evalDirectiveLabel || 'Senior Operational Directive'}
                                                            </span>
                                                            <p className="text-[11px] text-slate-300 font-medium leading-relaxed">
                                                                {simResult.directive}
                                                            </p>
                                                        </div>
                                                    </div>

                                                </div>
                                            ) : (
                                                <div className="text-center py-12 text-slate-500 space-y-2">
                                                    <i className="fa-solid fa-clipboard-check text-3xl"></i>
                                                    <p className="text-xs">
                                                        {lang === 'jp'
                                                            ? '左側のエディタで実務文を作成後、「AI適合性評価を実行」ボタンを押すと、多角的なルーブリック分析レポートが生成されます。'
                                                            : lang === 'en'
                                                                ? 'Draft your response on the left and click "Run AI Evaluation" to generate comprehensive rubric feedback.'
                                                                : '좌측 폼에 실무 대응문을 작성 후 [실무 적합성 평가 실행] 버튼을 클릭하면 도메인별 다면 평가 결과가 생성됩니다.'}
                                                    </p>
                                                </div>
                                            )}
                                        </div>

                                        <div className="text-[10px] text-slate-400 pt-2 border-t border-slate-800/80">
                                            {curT.evalFooterNote}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>

                    {/* Footer */}
                    <footer className="max-w-7xl mx-auto px-6 mt-16 text-center text-xs text-slate-500 border-t border-slate-800 pt-6 space-y-1">
                        <p>© 2026 David Yeonwoo Park Career Development Suite. All rights reserved.</p>
                        <p>GitHub Repository: <a href="https://github.com/Salmonyeonwoo/Portfolio-for-application-of-AI-Job-offers" target="_blank" className="text-cyan-400 hover:underline">Portfolio-for-application-of-AI-Job-offers</a></p>
                    </footer>

                    {/* Contact Modal (Synced with index (2).html) */}
                    {contactModalOpen && (
                        <div className="fixed inset-0 bg-black/75 backdrop-blur-sm flex justify-center items-center z-50 p-4">
                            <div className="bg-slate-900 border border-slate-700 text-slate-100 rounded-3xl p-6 sm:p-8 max-w-md w-full relative shadow-2xl space-y-5 animate-in fade-in">
                                <button
                                    onClick={() => setContactModalOpen(false)}
                                    className="absolute top-4 right-5 text-slate-400 hover:text-white text-2xl font-bold transition-colors"
                                >
                                    &times;
                                </button>
                                <h3 className="text-xl font-black text-white text-center border-b border-slate-800 pb-3">
                                    {lang === 'jp' ? '連絡先情報 (Contact Info)' : lang === 'en' ? 'Contact Information' : '연락처 정보 (Contact Info)'}
                                </h3>
                                <div className="space-y-4 text-xs sm:text-sm">
                                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-1.5">
                                        <h4 className="font-bold text-cyan-400 flex items-center gap-2">
                                            <i className="fa-brands fa-line text-green-400"></i>
                                            <i className="fa-brands fa-whatsapp text-emerald-400"></i>
                                            <span>{lang === 'jp' ? 'メッセンジャー (Kakao / LINE / WhatsApp)' : lang === 'en' ? 'Instant Messengers (Kakao / LINE / WhatsApp)' : '메신저 (Kakao / LINE / WhatsApp)'}</span>
                                        </h4>
                                        <p className="text-slate-300 font-mono text-xs">+6010-968-1392 (Malaysia)</p>
                                        <p className="text-slate-300 font-mono text-xs">+8210-2153-1208 (Korea)</p>
                                    </div>
                                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-1.5">
                                        <h4 className="font-bold text-rose-400 flex items-center gap-2">
                                            <i className="fa-solid fa-envelope"></i>
                                            <span>{lang === 'jp' ? 'メールアドレス (Email)' : lang === 'en' ? 'Direct Email' : '이메일 (Email)'}</span>
                                        </h4>
                                        <p className="text-slate-300 font-mono text-xs">yeonwoopark40@gmail.com</p>
                                        <p className="text-slate-300 font-mono text-xs">yunwoopk@gmail.com</p>
                                        <p className="text-slate-300 font-mono text-xs">yunwoopk@hanmail.net</p>
                                    </div>
                                </div>
                                <button
                                    onClick={() => setContactModalOpen(false)}
                                    className="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black py-2.5 rounded-xl transition-all text-xs"
                                >
                                    {lang === 'jp' ? '閉じる (Close)' : lang === 'en' ? 'Close' : '닫기 (Close)'}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
